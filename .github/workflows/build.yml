name: build-kpw3-arm

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'preview.html']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake perl python3

      - name: Download toolchain and dependencies
        shell: pwsh
        run: ./tools/prepare-arm.ps1

      - name: Prepare native headers
        run: python3 tools/prepare_native_headers.py

      - name: Build ARM static binary
        run: |
          cp config.example.yaml config.yaml
          bash tools/build-arm.sh

      - name: Package for KPW3
        run: bash tools/package-arm.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kindle-dashboard-kpw3
          path: dist/kindle-dashboard-*-kpw3.tar.gz
